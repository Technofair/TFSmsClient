<p-confirmDialog  [baseZIndex]="10000"></p-confirmDialog>
<p-panel>
    <ng-template pTemplate="header"> <span class="text-primary font-semibold text-xl">{{'MobileMessageTemplate' |
            translate}}</span></ng-template>
    <form [formGroup]="mobileMesTemFrm" (ngSubmit)="save()">
        <input type="hidden" formControlName="id" value="0">
        <div class="grid">
            <div class=" field col-12 sm:col-6 md:col-3 lg:col-3 xl:col-3">
                <label>{{'MessageType'|translate}}</label><span class="text-danger"> *</span>
                <p-dropdown [options]="messageType" [style]="{'width':'100%'}" formControlName="scpMessageTypeId"
                    [filter]="true" filterBy="name" [showClear]="true"
                    placeholder="{{'SELECT'|translate}}" optionLabel="name" optionValue="id" (onChange)="messageSet()" ></p-dropdown><br>
            </div>     
            
            <div class="field col-12 sm:col-6 md:col-3 lg:col-3 xl:col-3">
                <label>{{'Timeframe' | translate}}</label>
                <input type="number" class="p-2  w-full" formControlName="timeframe" pInputText />
            </div>
            <div class="field col-12 sm:col-6 md:col-3 lg:col-3 xl:col-3">
                <label>{{'Frequency'|translate}}</label>
                <p-dropdown [options]="scpFrequency" [style]="{'width':'100%'}" formControlName="cmnFrequencyId"
                    [filter]="true" filterBy="name" [showClear]="true"
                    placeholder="{{'SELECT'|translate}}" optionLabel="name" optionValue="id"></p-dropdown><br>
            </div>                                            
            <div class="field col-12 sm:col-6 md:col-3 lg:col-3 xl:col-3">
                <label>{{'serviceInitiate' | translate}}</label>
                <input type="time" class="p-2  w-full" formControlName="serviceInitiate" pInputText />
            </div>
            
            <div class="ml-auto">                       
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" formControlName="lang" name="inlineRadioOptions" id="inlineRadio1" value="bn">
                  <label class="form-check-label" for="inlineRadio1">Bn</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" formControlName="lang" name="inlineRadioOptions" id="inlineRadio2" value="en">
                  <label class="form-check-label" for="inlineRadio2">En</label>
                </div>
          </div>
          
            <div class="card flex justify-content-center" style="width:  100% ;">
                <p-accordion [activeIndex]="0">
                    <p-accordionTab header="{{'Parameters'|translate}}">
                        <div class="p-2 border-1 surface-border border-round ">
                            <div style="display: flex; flex-wrap: wrap;">
                                <div *ngFor="let product of availableProducts" 
                                class="p-2 border-round shadow-1" 
                                pDraggable 
                                (onDragStart)="dragStart(product)" 
                                (onDragEnd)="dragEnd()">
                                {{product.name}}
                                </div>
                            </div>
                           
                        </div>
                       
                    </p-accordionTab>
                    
                </p-accordion>
            </div>
            <div class=" field col-12 sm:col-6 md:col-12 lg:col-12 xl:col-12" pDroppable (onDrop)="drop()">
                <label>{{'Message' | translate}}</label>
                <textarea rows="2" cols="34" pInputTextarea formControlName="message"  [(ngModel)]="setMessage" ></textarea>
            </div>      
            <div class="field col-12 sm:col-12 md:col-12 lg:col-12 xl:col-12">
                <div class="card-footer">
                    <div class="">
                        <p-button (click)="save()" [disabled]="mobileMesTemFrm.invalid" styleClass="p-button-success p-button-sm"
                            type="submit" icon="pi pi-check" label="{{'SAVE' | translate}}"></p-button>&nbsp;
                        <p-button (click)="reset()" styleClass="p-button-warning p-button-sm" icon="pi pi-refresh"
                            (click)="reset()" label="{{'RESET'|translate}}"> </p-button>&nbsp;
                    </div>
                </div>
            </div>
        </div>
    </form>
</p-panel>
<p-table #dt [value]="list" dataKey="id" [rowHover]="true" [rows]="10" [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[15,25,50,100]" [paginator]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [filterDelay]="0"
    [globalFilterFields]="['description','typeName','startDate','endDate']"
    styleClass="p-datatable-sm p-datatable-gridlines" [tableStyle]="{'min-width': '50rem'}">
    <ng-template pTemplate="caption">
        <div class="flex">
            <button pButton label="Clear" class="p-button-outlined p-button-sm" icon="pi pi-filter-slash"
                (click)="clear(dt)"></button>
            <span class="p-input-icon-left ml-auto float-right">
                <i class="pi pi-search"></i>
                <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Search keyword" />
            </span>
        </div>
    </ng-template>
    <ng-template pTemplate="header">
        <tr>
            <th>{{'SL#' | translate}}</th>
            <th pSortableColumn="startDate" style="text-align: center">
                <div class="vcenter text-center">
                    {{'MessageType' | translate}}
                </div>
            </th>
            <th pSortableColumn="message" style="text-align: center">
                <div class="vcenter text-center">
                    {{'Description' | translate}}
                </div>
            </th>
            <th pSortableColumn="osdType" style="text-align: center">
                <div class="vcenter text-center">
                    {{'StartDate' | translate}}
                </div>
            </th>
            <!-- <th pSortableColumn="startTime" style="text-align: center">
                <div class="vcenter text-center">
                    {{'EndDate' | translate}}
                </div>
            </th> -->
            <!-- <th class="vcenter text-center">{{'Frequency' | translate}}</th> -->
            <th class="vcenter text-center">{{'ACTION' | translate}}</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-r let-i="rowIndex">
        <tr class="p-selectable-row">
            <td>{{i+1}}</td>
            <td>{{r.typeName}}</td>
            <td>{{r.description}}</td>
            <td>{{r.startDate |date:'short' }}</td>
            <!-- <td>{{r.endDate |date:'short'}}</td> -->
            <!-- <td>{{r.frequency}}</td> -->
            <td class="vcenter text-center">
                <p-button (onClick)="edit(r.id)" styleClass="p-button-info rounded-0 px-2 py-1 mr-2" type="button" icon="pi pi-pencil"
                title="{{'Edit' | translate}}"></p-button>
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="9">No data found.</td>
        </tr>
    </ng-template>
</p-table>
