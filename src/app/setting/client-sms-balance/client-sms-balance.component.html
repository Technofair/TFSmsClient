<p-confirmDialog class="xl:w-15rem lg:w-15rem md:w-15rem sm:w-15rem" [baseZIndex]="10000"></p-confirmDialog>

<p-panel>
    <ng-template pTemplate="header"> <span class="text-primary font-semibold text-xl ">{{'Client SMS Balance' |
        translate}}</span>        
</ng-template>

<form [formGroup]="frm">
    <input type="hidden" formControlName="id" value=0>
    <div class="formgrid grid">

        <div class="field col-12 sm:col-6 md:col-4 lg:col-4 xl:col-4">
            <label>{{'Company Customer'|translate}}</label>
            <p-dropdown [options]="companyList" [style]="{'width':'100%'}" formControlName="cmnCompanyCustomerId"
             [filter]="true" filterBy="text" [showClear]="true" placeholder="{{'SELECT'|translate}}"
                optionLabel="name" optionValue="id"></p-dropdown><br>
        </div>

        <div class="field col-12 sm:col-6 md:col-4 lg:col-4 xl:col-4">
            <label>{{'No Of Message'|translate}}</label>
            <input type="number" class="p-2 w-full" formControlName="noOfMessage"
                pInputText />
        </div>

        <div class="field col-12 sm:col-6 md:col-4 lg:col-4 xl:col-4">
            <label>{{'RATE'|translate}}</label>
            <input type="number" class="p-2 w-full" formControlName="rate"
                pInputText />
        </div>

        <div class="field col-12 sm:col-6 md:col-4 lg:col-4 xl:col-4">
            <label>{{'Balance'|translate}}</label>
            <input type="number" class="p-2 w-full" formControlName="balance"
                pInputText />
        </div>

    </div>
</form>

<ng-template pTemplate="footer">
    <div class="formgrid grid">
        <div class="field col-12 sm:col-6 md:col-3 lg:col-3 xl:col-3">
            <div class="card-footer">
                <div class="flex justify-center">
                    <p-button (click)="save()" [disabled]="frm.invalid" styleClass="p-button-success p-button-sm"
                        type="submit" icon="pi pi-check" label="{{'SAVE'|translate}}"></p-button>&nbsp;
                    <p-button type="reset" styleClass="p-button-warning p-button-sm" icon="pi pi-refresh"
                        (click)="reset()" label="{{'RESET'|translate}}"></p-button>
                </div>
            </div>
        </div>
    </div>
</ng-template>
</p-panel>
