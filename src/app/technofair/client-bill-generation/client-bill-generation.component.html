<p-confirmDialog [baseZIndex]="10000"></p-confirmDialog>
<p-panel>
  <ng-template pTemplate="header"> <span class="text-primary font-semibold text-xl">{{'ClientBillGeneration' |
      translate}}</span></ng-template>
  <form [formGroup]="frm">
    <input type="hidden" formControlName="id" value="0">
    <div class="formgrid grid">
      <div class="field col-12 sm:col-6 md:col-3 lg:col-3 xl:col-3">
        <label>{{'Months'|translate}}</label><span class="text-danger"> *</span>
        <p-dropdown [options]="monthes" [style]="{'width':'100%'}" formControlName="monthId"
          [filter]="true" filterBy="title" [showClear]="true" placeholder="{{'SELECT'|translate}}"
          optionLabel="name" optionValue="id"  ></p-dropdown><br>
      </div>   
        <div class="field col-12 sm:col-6 md:col-3 lg:col-3 xl:col-3">
            <label>{{'Year'|translate}}</label><span class="text-danger">*</span>
            <p-dropdown [options]="years" [style]="{'width':'100%'}" formControlName="year"
          [filter]="true" filterBy="title" [showClear]="true" placeholder="{{'SELECT'|translate}}"
          optionLabel="name" optionValue="id"  ></p-dropdown><br>
          </div>
        
     
      <div class="field col-12 sm:col-12 md:col-12 lg:col-12 xl:col-12">
        <div class="flex justify-center">          
            <p-button (click)="save()" [disabled]="frm.invalid"
              styleClass="p-button-success p-button-sm" type="submit" icon="pi pi-check"
              label="{{'GenerateInvoice'|translate}}"></p-button>
            
          </div>
        </div>
      </div>   
  </form>
</p-panel>
