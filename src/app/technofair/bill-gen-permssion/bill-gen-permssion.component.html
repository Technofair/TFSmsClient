<p-confirmDialog [baseZIndex]="10000"></p-confirmDialog>
<p-panel>
  <ng-template pTemplate="header"> <span class="text-primary font-semibold text-xl">{{'Bill Generation Permssion' |
          translate}}</span></ng-template>
<form [formGroup]="frm">
  <input type="hidden" formControlName="id" value="0"> 
    <div class="formgrid grid">
      <div class="field col-12 sm:col-6 md:col-3 lg:col-3 xl:col-3">
        <label>{{'Months'|translate}}</label><span class="text-danger"> *</span>
        <p-dropdown [options]="monthes" [style]="{'width':'100%'}" formControlName="tfaMonthId"
          [filter]="true" filterBy="title" [showClear]="true" placeholder="{{'SELECT'|translate}}"
          optionLabel="name" optionValue="id"  ></p-dropdown><br>
      </div>      
      <div class="field col-12 sm:col-6 md:col-3 lg:col-3 xl:col-3">
        <label>{{'Year'|translate}}</label><span class="text-danger">*</span><br>
        <p-dropdown [options]="years" [style]="{'width':'100%'}" formControlName="year"
      [filter]="true" filterBy="title" [showClear]="true" placeholder="{{'SELECT'|translate}}"
      optionLabel="name" optionValue="id"  ></p-dropdown><br>
  </div>      
      <div class="form-check col-12 sm:col-6 md:col-2 lg:col-2 xl:col-2 xl:mt-5 lg:mt-5 md:mt-5 sm:mt-5 m-5">
        <input class="form-check-input" type="checkbox" value="true" id="flexCheckDefault" [defaultChecked]="true"
            formControlName="isClose">
        <label class="form-check-label" for="flexCheckDefault"> {{'IsClose' | translate}} </label>
    </div>    

      <div class="field col-12 sm:col-12 md:col-12 lg:col-12 xl:col-12">
        <div class="">
          <div class="">
            <p-button (click)="save()" [disabled]="frm.invalid" *ngIf="formId==0"
              styleClass="p-button-success p-button-sm" type="submit" icon="pi pi-check"
              label="{{'SAVE'|translate}}"></p-button>
            <p-button (click)="save()" [disabled]="frm.invalid" *ngIf="formId==1"
              styleClass="p-button-success p-button-sm" type="submit" icon="pi pi-check"
              label="{{'UPDATE'|translate}}"></p-button>&nbsp;
            <p-button type="reset" *ngIf="formId==0||formId==1" styleClass="p-button-warning p-button-sm"
              icon="pi pi-refresh" (click)="reset()" label="{{'RESET'|translate}}"></p-button>
          </div>
        </div>
      </div>
    </div>  
</form>
</p-panel>


<p-table #dt [value]="list" dataKey="id" [rowHover]="true" [rows]="10" [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[15,25,50,100]" [paginator]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [filterDelay]="0"
  [globalFilterFields]="['name']" styleClass="p-datatable-sm p-datatable-gridlines pt-3" [tableStyle]="{'min-width': '50rem'}">

  <ng-template pTemplate="caption">
    <div class="flex">
      <button pButton label="Clear" class="p-button-outlined p-button-sm" icon="pi pi-filter-slash"
        (click)="clear(dt)"></button>
      <span class="p-input-icon-left ml-auto float-right">
        <i class="pi pi-search"></i>
        <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
          placeholder="Search keyword" />
      </span>
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="tFAMonth" style="text-align: center">
        <div class="vcenter text-center">
          {{'Months'|translate}}
          <p-sortIcon field="name"></p-sortIcon>
          <p-columnFilter type="text" field="name" display="menu" class="ml-auto"></p-columnFilter>
        </div>
      </th>
      <th class="vcenter text-center">{{'Year'|translate}}</th>
      <th class="vcenter text-center">{{'IsClose'|translate}}</th>
      <th class="vcenter text-center">{{'CloseDate'|translate}}</th>
      <th class="vcenter text-center">{{'ACTION'|translate}}</th>
    </tr>
    <tr>
      <div [hidden]="progressStatus" style="position: absolute; z-index: 10; ">
       <p-progressSpinner></p-progressSpinner>
      </div>
   </tr>
  </ng-template>


  <ng-template pTemplate="body" let-r>
    <tr class="p-selectable-row">
      <td>{{r.tFAMonth}}</td>
      <td>{{r.year}}</td>
      <td>{{r.isClose}}</td>
      <td>{{r.closeDate}}</td>
      <td class="vcenter text-center">
        <p-button type="button" styleClass="p-button-success p-button-sm mr-2 px-2 py-1" icon="pi pi-pencil"
          (click)="edit(r.id)" data-toggle="tooltip" title="{{'EDIT' | translate}}"></p-button>        
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="9">No data found.</td>
    </tr>
  </ng-template>
</p-table>
